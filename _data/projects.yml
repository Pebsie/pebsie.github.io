- name: BrawlQuest Content Editor
  icon: /assets/img/work/brawlquest-editor/journey.webp
  blurb: A browser-only editor for everything in BrawlQuest, from quests and dialogue to mobs, loot and the world map. It opens the game's SQLite database in the tab, checks it the way the server would, and commits it to GitHub.
  note: Live. Used to build BrawlQuest 2.0's content.
  year: "2026"
  links:
    - label: Open the editor
      url: /brawlquest-editor/
    - label: Source on GitHub
      url: https://github.com/Pebsie/brawlquest-editor
