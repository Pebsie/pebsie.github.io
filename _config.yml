# Site settings. Edit these, then push. GitHub Pages rebuilds on its own.
title: Thomas Lock
description: Apps, games and tools by Thomas Lock.
url: https://tomlock.me
baseurl: ""   # Stays empty for tomlock.me. The /v2 preview repo (Pebsie/v2) uses its own config with baseurl /v2.
# preview: true adds a noindex robots tag (_includes/head.html). Leave that tag in place.
# This file keeps preview false. The tomlock.me/v2 repo (Pebsie/v2) sets preview: true,
# so the preview stays noindex until launch.
preview: false
lang: en-GB
# twitter here is twitter:creator. A plain string is treated as the name, which
# was rendering as @Thomas Lock.
author:
  name: Thomas Lock
  twitter: pebsiee
email: contact@tomlock.me
twitter:
  username: pebsiee
social:
  name: Thomas Lock
  links:
    - https://twitter.com/pebsiee
    - https://www.linkedin.com/in/pebsie/
    - https://github.com/Pebsie

# Shown in the footer and the contact section.
contact_links:
  - label: Email
    url: mailto:contact@tomlock.me
    text: contact@tomlock.me
  - label: GitHub
    url: https://github.com/Pebsie
    text: github.com/Pebsie
  - label: LinkedIn
    url: https://www.linkedin.com/in/pebsie/
    text: linkedin.com/in/pebsie
  - label: X / Twitter
    url: https://twitter.com/pebsiee
    text: "@pebsiee"

# One Markdown file per case study in _case_studies/.
collections:
  case_studies:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study
      # So an opening heading is not used as the link-preview text.
      excerpt_separator: "<!--more-->"
  # Older tools that live in this repo. Kept as they are, left out of the sitemap.
  - scope:
      path: "bq-editor"
    values:
      sitemap: false
  - scope:
      path: "dbd"
    values:
      sitemap: false
  - scope:
      path: "img"
    values:
      sitemap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: apos,apos,quot,quot

exclude:
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
